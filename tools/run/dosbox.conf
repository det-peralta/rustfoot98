# Local DOSBox config to run the original Elifoot 98 (Windows 3.1 image from the web bundle).
[sdl]
fullscreen=false
windowresolution=1024x768
output=opengl
autolock=false
[dosbox]
machine=svga_s3
memsize=8
[cpu]
core=auto
cputype=auto
cycles=auto 4000 66% limit 24000
[render]
aspect=true
scaler=none
[mixer]
nosound=true
[autoexec]
@echo off
mount d ./d
imgmount c ./hdd.img -size 512,32,2,800
c:
autoexec.bat
