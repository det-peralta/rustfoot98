[package]
name = "elifoot-ui"
version = "0.1.0"
edition = "2021"
description = "Backend-independent immediate-mode UI for the Elifoot 98 port, with an optional SDL2 front end"

[dependencies]
elifoot-core = { path = "../core" }
sdl2 = { version = "0.38", optional = true, features = ["ttf"] }

[features]
default = []
sdl = ["dep:sdl2"]

[[bin]]
name = "elifoot-sdl"
path = "src/bin/elifoot_sdl.rs"
required-features = ["sdl"]

[[bin]]
name = "win31shot"
path = "src/bin/win31shot.rs"

[[bin]]
name = "classic_shot"
path = "src/bin/classic_shot.rs"

[[bin]]
name = "round_shot"
path = "src/bin/round_shot.rs"
