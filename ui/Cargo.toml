[package]
name = "rustfoot-ui"
version = "0.1.0"
edition = "2021"
description = "The Elifoot 98 interface rebuilt pixel for pixel: a Windows 3.1 / Delphi VCL renderer, the game's windows and dialogs, and the team editor"
license = "MIT"

[dependencies]
rustfoot-core = { path = "../core" }
sdl2 = { version = "0.38", optional = true, features = ["ttf"] }

[features]
default = []
sdl = ["dep:sdl2"]

[[bin]]
name = "rustfoot-sdl"
path = "src/bin/rustfoot_sdl.rs"
required-features = ["sdl"]

[[bin]]
name = "win31shot"
path = "src/bin/win31shot.rs"

[[bin]]
name = "classic_shot"
path = "src/bin/classic_shot.rs"

[[bin]]
name = "round_shot"
path = "src/bin/round_shot.rs"
